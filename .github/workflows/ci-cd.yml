
name: GiveConnect CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          python -m pytest -v

      
  
  security-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/python --error

  dependency-scan:
    name: Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Dependencies
        run: pip-audit

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build:
    name: Build Application Artifact
    runs-on: ubuntu-latest
    needs: [test, security-scan, dependency-scan, secret-scan]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Application ZIP
        run: |
          zip -r giveconnect.zip main.py database.py events.py templates requirements.txt deploy.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: giveconnect-build
          path: giveconnect.zip
          retention-days: 7


  upload-to-s3:
    name: Upload Build to AWS S3
    runs-on: ubuntu-latest
    needs: [test, security-scan, dependency-scan, secret-scan, build]

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: giveconnect-build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload ZIP to S3
        run: |
          aws s3 cp giveconnect.zip s3://giveconnect-build-artifacts-hammas-2026/giveconnect.zip


  
  deploy-to-ec2:
    name: Deploy GiveConnect to EC2
    runs-on: ubuntu-latest
    needs: [upload-to-s3]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Generate Temporary S3 Download Link
        run: |
          PRESIGNED_URL=$(aws s3 presign s3://giveconnect-build-artifacts-hammas-2026/giveconnect.zip --expires-in 3600)
          echo "PRESIGNED_URL=$PRESIGNED_URL" >> "$GITHUB_ENV"

      - name: Deploy Application Through SSM
        run: |
          jq -n --arg url "$PRESIGNED_URL" '{
            commands: [
              "curl -fL --retry 3 \u0027" + $url + "\u0027 -o /tmp/giveconnect.zip",
              "mkdir -p /tmp/giveconnect-deploy",
              "python3 -c \u0027import zipfile; zipfile.ZipFile(\"/tmp/giveconnect.zip\").extract(\"deploy.sh\", \"/tmp/giveconnect-deploy\")\u0027",
              "bash /tmp/giveconnect-deploy/deploy.sh"
            ]
          }' > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-03ace437738d32291 \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --comment "Deploy GiveConnect application" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-03ace437738d32291 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "GiveConnect deployed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-03ace437738d32291 \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out."
          exit 1
