
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiveConnect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
            background: #f5f7f6;
            color: #24352d;
        }

        h1 {
            color: #24734b;
        }

        .roles {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            flex: 1;
            padding: 25px;
            background: white;
            border-radius: 10px;
            border: 1px solid #dce5df;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #24734b;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>GiveConnect</h1>
    <p>Connecting people who want to donate with people who need support.</p>

    <div class="roles">
        <div class="card">
            <h2>I'm a Donor</h2>
            <p>Offer items to people who need them.</p>
            <a href="/donor">Continue as Donor</a>
        </div>

        <div class="card">
            <h2>I'm a Beneficiary</h2>
            <p>Browse available donations and request items.</p>
            <a href="/beneficiary">Continue as Beneficiary</a>
        </div>
    </div>
</body>
</html>
